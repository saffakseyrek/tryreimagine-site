<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reimagine Studio</title>
<meta name="description" content="Reimagine Studio makes mobile apps. Support, privacy and terms for each app.">
<style>
  :root { --bg: #fbfaf8; --fg: #1b1a19; --muted: #6b6760; --line: #e7e3dc; --accent: #1b1a19; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141413; --fg: #f3f1ec; --muted: #a39f97; --line: #2c2b29; --accent: #f3f1ec; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 20px; }
  h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.01em; }
  p.lead { color: var(--muted); margin: 0 0 40px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 12px; }
  ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
  li { padding: 18px 0; border-bottom: 1px solid var(--line); }
  .app { font-weight: 600; }
  .links { margin-top: 6px; font-size: 15px; }
  .links a { color: var(--accent); margin-right: 16px; text-underline-offset: 3px; }
  footer { margin-top: 48px; color: var(--muted); font-size: 14px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Reimagine Studio</h1>
  <p class="lead">We make mobile apps.</p>

  <h2>Apps</h2>
  <ul>
    <li>
      <div class="app">Hair Mood AI</div>
      <div class="links">
        <a href="https://api-production-62e6.up.railway.app/legal/support.html">Support</a>
        <a href="https://api-production-62e6.up.railway.app/legal/privacy.html">Privacy</a>
        <a href="https://api-production-62e6.up.railway.app/legal/terms.html">Terms</a>
      </div>
    </li>
  </ul>

  <footer>
    Contact: <a href="mailto:saffakseyrek@gmail.com">saffakseyrek@gmail.com</a>
  </footer>
</main>
</body>
</html>
